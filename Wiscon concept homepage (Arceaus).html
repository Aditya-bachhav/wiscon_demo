<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wiscon concept homepage | Arceaus</title><meta name="description" content="A concept homepage for Wiscon, by Arceaus."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--ink:#1d1d1f;--g:#86868b;--lt:#f5f5f7;--wh:#fff;--card:#fff;--bl:#0066cc;--ln:#d2d2d7;--f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f5f5f7;--g:#a1a1a6;--lt:#161617;--wh:#000;--card:#1c1c1e;--bl:#2997ff;--ln:#38383a;}}:root[data-theme="dark"]{--ink:#f5f5f7;--g:#a1a1a6;--lt:#161617;--wh:#000;--card:#1c1c1e;--bl:#2997ff;--ln:#38383a;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--wh);color:var(--ink);font:400 17px/1.47 var(--f);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(22,22,23,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);z-index:30}
a{color:inherit;text-decoration:none}
.cn{background:var(--lt);color:var(--g);font-size:12px;text-align:center;padding:10px 16px}
.gn{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:48px;background:rgba(22,22,23,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);color:#f5f5f7}
.gn div{max-width:1024px;margin:0 auto;height:100%;padding:0 22px;display:flex;align-items:center;justify-content:space-between;font-size:12px}
.gn nav{display:flex;gap:clamp(14px,3.4vw,38px)}.gn a{opacity:.85;transition:opacity .2s}.gn a:hover{opacity:1}.gn .lg{font-size:19px;font-weight:600;letter-spacing:-.03em;opacity:1}
.dk,.lt,.wh{text-align:center;overflow:hidden}.dk{background:#000;color:#f5f5f7;padding:clamp(48px,7vw,88px) 0 0}.lt{background:var(--lt);padding:clamp(56px,8vw,100px) 0 0}.wh{background:var(--wh);padding:clamp(56px,8vw,100px) 0}
.in{max-width:1180px;margin:0 auto;padding:0 22px}
.ey{font-size:clamp(19px,2.1vw,28px);font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
h1,h2{margin:0;font-weight:600;letter-spacing:-.04em;line-height:1.04}h1{font-size:clamp(48px,8.6vw,106px)}h2{font-size:clamp(38px,6vw,76px)}
.sb{font-size:clamp(19px,2.3vw,28px);font-weight:600;color:#a1a1a6;margin:14px auto 0;max-width:22em;letter-spacing:-.02em}.sb b{color:inherit}.dk .sb b{color:#f5f5f7}.lt .sb{color:var(--g)}.lt .sb b{color:var(--ink)}
.ls{display:flex;justify-content:center;gap:clamp(22px,3vw,40px);margin-top:22px;flex-wrap:wrap}
.ls a{color:#2997ff;font-size:clamp(17px,1.6vw,21px)}.lt .ls a,.wh .ls a{color:var(--bl)}.ls a::after{content:" ›"}.ls a:hover{text-decoration:underline}
.stage{position:relative;width:min(1180px,100%);margin:12px auto 0;aspect-ratio:16/9}.stage canvas{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:700px){.stage{aspect-ratio:4/3}}
.bn{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1180px;margin:0 auto;padding:0 22px}
.tl{border-radius:28px;min-height:clamp(420px,52vw,620px);padding:clamp(32px,4vw,52px) 24px 0;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;background:var(--card)}
.tl h3{margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.08}.tl p{margin:10px 0 0;color:var(--g);font-size:clamp(17px,1.7vw,21px);font-weight:600;letter-spacing:-.015em;max-width:18em}.tl .ey{font-size:14px;color:var(--g);font-weight:600;letter-spacing:0;margin-bottom:8px}
.tl svg{margin-top:auto;width:min(100%,420px);height:auto;transition:transform .8s cubic-bezier(.2,.8,.2,1)}.tl:hover svg{transform:translateY(-10px) scale(1.03)}
.tl.d{background:#000;color:#f5f5f7}.tl.d .ey,.tl.d p{color:#a1a1a6}.tl.d .ls a{color:#2997ff}
.tl.w{grid-column:span 2;min-height:clamp(300px,34vw,400px);justify-content:center;padding-bottom:40px}
.tl.g{background:linear-gradient(135deg,#0a84ff,#64d2ff);color:#fff;justify-content:center;padding-bottom:40px}.tl.g p,.tl.g .ey{color:rgba(255,255,255,.85)}.tl.g h3{font-size:clamp(36px,5vw,64px)}
.tl.n h3{font-size:clamp(120px,18vw,240px);line-height:.85;background:linear-gradient(180deg,#f5f5f7,#6e6e73);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.06em}.tl.n{justify-content:center;padding-bottom:40px}
@media (max-width:820px){.bn{grid-template-columns:1fr}.tl.w{grid-column:auto}}
.fd{max-width:1024px;margin:clamp(32px,5vw,56px) auto 0;padding:0 22px 0;text-align:left}
.fc{background:var(--card);border-radius:28px;padding:clamp(24px,4vw,56px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center;margin-bottom:clamp(56px,8vw,100px)}
.sg{display:flex;background:var(--lt);border-radius:99px;padding:3px;margin-bottom:34px;flex-wrap:wrap}.sg button{flex:1;font:500 14px var(--f);padding:9px 12px;border-radius:99px;border:0;background:transparent;color:var(--ink);cursor:pointer;transition:all .25s;white-space:nowrap}.sg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.ct{display:block;margin-bottom:26px}.ct span{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--g);margin-bottom:10px}.ct b{font-size:21px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
input[type=range]{width:100%;accent-color:#0071e3;height:28px}
.sw{display:flex;align-items:center;gap:14px;font:500 15px var(--f);background:none;border:0;color:var(--ink);cursor:pointer;padding:0}.sw i{width:51px;height:31px;border-radius:99px;background:#d2d2d7;position:relative;transition:background .3s}.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .3s}.sw[aria-checked=true] i{background:#34c759}.sw[aria-checked=true] i::after{transform:translateX(20px)}
.rs{text-align:center;animation:pop .6s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.bg{font-size:clamp(88px,13vw,168px);font-weight:600;letter-spacing:-.07em;line-height:.9}.bg small{font-size:.22em;letter-spacing:-.02em;color:var(--g);margin-left:8px;font-weight:600}
.rs p{color:var(--g);margin:14px auto 22px;max-width:24em}.pr{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;padding:16px 20px;border-radius:18px;background:var(--lt);transition:background .25s}.pr:hover{background:var(--ln)}.pr em{display:block;font-style:normal;font-weight:600}.pr i{font-style:normal;font-size:13px;color:#bf4800}.pr b{font-weight:600;white-space:nowrap}
.fn{display:block;margin-top:16px;font-size:12px;color:var(--g)}
@media (max-width:820px){.fc{grid-template-columns:1fr}}
.ir{max-width:1024px;margin:36px auto 0;padding:0 22px;display:grid;grid-template-columns:1fr 1fr;column-gap:56px;text-align:left}
.ir a{display:flex;justify-content:space-between;padding:17px 0;border-top:1px solid var(--ln);font-size:19px;font-weight:600;letter-spacing:-.02em;transition:color .2s}.ir a:hover{color:var(--bl)}.ir a span{color:var(--g)}
.nt{max-width:1024px;margin:20px auto 0;padding:0 22px;text-align:left;color:var(--g);font-size:13px}
@media (max-width:700px){.ir{grid-template-columns:1fr}}
footer{background:var(--lt);color:var(--g);font-size:12px;padding:22px 0 44px;text-align:left}footer div{max-width:1024px;margin:0 auto;padding:0 22px;border-top:1px solid var(--ln);padding-top:18px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s,transform 1s cubic-bezier(.2,.8,.2,1)}.rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto}.rv{opacity:1;transform:none}}
.tp{color:#bf4800!important;font-size:14px;margin:-6px auto 18px!important}
